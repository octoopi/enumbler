name: CI Matrix Testing

on:
  push:
    branches: [ main ]
    tags: ["*"]
  pull_request:

# A new push to the same ref supersedes any in-flight run; cancel the stale
# one rather than paying for both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rspec:
    runs-on: ubuntu-latest
    # Typical matrix job is under 2 minutes; a hung job otherwise runs to
    # GitHub's 6-hour default.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby: [3.1, 3.2, 3.3, 3.4]
        rails_version: ["6.0", "6.1", "7.0", "7.1", "7.2", "8.0"]
        exclude:
          - ruby: 3.1
            rails_version: "8.0"
          - ruby: 3.4
            rails_version: "6.0"
          - ruby: 3.4
            rails_version: "6.1"
          - ruby: 3.4
            rails_version: "7.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Install dependencies
        env:
          BUNDLE_GEMFILE: Gemfile.rails${{ matrix.rails_version }}
        run: |
          bundle install --jobs 4 --retry 3

      - name: Run specs
        env:
          BUNDLE_GEMFILE: Gemfile.rails${{ matrix.rails_version }}
        run: bundle exec rspec

  build:
    needs: rspec

    name: Publish Gem
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4

    - name: Publish to RubyGems
      run: |
        mkdir -p $HOME/.gem
        touch $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        printf -- "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > $HOME/.gem/credentials
        gem build *.gemspec
        gem push *.gem
      env:
        GEM_HOST_API_KEY: ${{secrets.RUBYGEMS_AUTH_TOKEN}}

